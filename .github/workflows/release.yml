name: release

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ensure-master:
    runs-on: ubuntu-latest

    steps:
      - name: Ensure master branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "release workflow must be run from refs/heads/master, got ${GITHUB_REF}" >&2
            exit 1
          fi

  verify:
    needs: ensure-master
    uses: ./.github/workflows/verify.yml

  publish:
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        run: |
          image="ghcr.io/${{ github.repository_owner }}/tg_stt_bot"
          tag="$(date -u +%Y%m%d-%H%M)-$(git rev-parse --short HEAD)"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "image_ref=${image}:${tag}" >> "${GITHUB_OUTPUT}"
          echo "latest_ref=${image}:latest" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ steps.meta.outputs.latest_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print published image
        run: |
          echo "Published image: ${{ steps.meta.outputs.image_ref }}"
          echo "Published image: ${{ steps.meta.outputs.latest_ref }}"
